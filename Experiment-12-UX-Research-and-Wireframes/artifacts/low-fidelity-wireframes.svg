      <rect x="18" y="185" width="82" height="36" rx="8" fill="#eee"/><rect x="110" y="185" width="82" height="36" rx="8" fill="#eee"/><rect x="202" y="185" width="100" height="36" rx="8" fill="#eee"/><text x="32" y="208" stroke="none" font-size="13">Meals</text><text x="123" y="208" stroke="none" font-size="13">Snacks</text><text x="216" y="208" stroke="none" font-size="13">Drinks</text>
