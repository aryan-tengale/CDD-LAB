      <rect x="18" y="365" width="284" height="70" fill="#fafafa"/><text x="30" y="393" stroke="none" font-size="15">Meal item 2</text><text x="30" y="415" stroke="none" font-size="13">Description / price</text>
      <rect x="18" y="470" width="284" height="60" fill="#eee"/><text x="90" y="507" stroke="none" font-size="17">View Cart</text>
