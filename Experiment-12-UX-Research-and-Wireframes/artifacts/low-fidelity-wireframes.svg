      <rect x="18" y="355" width="284" height="100" fill="#fafafa"/><rect x="30" y="367" width="76" height="76" fill="#ddd"/><text x="120" y="393" stroke="none" font-size="15">Restaurant B</text><text x="120" y="417" stroke="none" font-size="13">ETA · Price · Rating</text>
      <rect x="18" y="475" width="284" height="90" fill="#eee"/><text x="40" y="525" stroke="none" font-size="15">Home   Orders   Cart   Profile</text>
    </g>
    <g transform="translate(440 90)">
      <rect width="320" height="610" rx="18" fill="white"/><text x="18" y="35" stroke="none" font-size="22" font-weight="bold">2. Restaurant</text>
